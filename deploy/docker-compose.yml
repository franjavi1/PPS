#Estandarizacion de direcciones
#NGINX:    172.10.10.10
#Backs:    172.10.10.20 - 21 - 22
#Front:    172.10.10.30 - 31 - 32
#Postgres: 172.10.10.40 - 41 - 42
#Redis:    172.10.10.50

services:
  api_gateway:
    image: nginx:alpine
    container_name: bomberos_api_gateway
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro 
    depends_on:
      - backend
      - frontend
    networks:
      red_bomberos_estatica:
        ipv4_address: 172.10.10.10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bomberos_backend
    restart: always
    volumes:
      - ../backend:/app
    env_file:
      - ../backend/.env
    environment:
      - PORT=5000
      - REDIS_HOST=172.10.10.50
    depends_on:
      - postgres
      - redis
    networks:
      red_bomberos_estatica:
        ipv4_address: 172.10.10.20

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: bomberos_frontend
    restart: always
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks:
      red_bomberos_estatica:
        ipv4_address: 172.10.10.30

  postgres:
    image: postgres:16
    container_name: bomberos_postgres
    restart: always
    environment:
      POSTGRES_DB: bomberos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432" 
    networks:
      red_bomberos_estatica:
        ipv4_address: 172.10.10.40
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bomberos_redis
    networks:
      red_bomberos_estatica:
        ipv4_address: 172.10.10.50

volumes:
  postgres_data:

#Rango de 254 direcciones disponbles
networks:
  red_bomberos_estatica:
    driver: bridge
    ipam:
      config:
        - subnet: 172.10.10.0/24