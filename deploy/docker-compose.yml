# Estandarizacion de direcciones
# Backs:    172.10.10.20
# Front:    172.10.10.30
# Postgres: 172.10.10.40
# Redis:    172.10.10.50

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bomberos_backend
    restart: always
    command: sh -c "pip install -e /auth-common --quiet && python app.py"
    volumes:
      - ../backend:/app
      - ../auth-common:/auth-common
    ports:
      - "5000:5000"
    env_file:
      - ../backend/.env
    environment:
      - PORT=5000
      - REDIS_HOST=172.10.10.50
      - AUTH_COMMON_REDIS_URL=redis://redis:6379/0
      - AUTH_COMMON_SESSION_TTL=900
    depends_on:
      - postgres-planes
      - redis
    networks:
      red_bomberos_estatica:
        ipv4_address: 172.10.10.20

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: bomberos_frontend
    restart: always
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks:
      red_bomberos_estatica:
        ipv4_address: 172.10.10.30

  postgres-planes:
    image: postgres:17
    container_name: bomberos_postgres
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bomberos_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    environment:
      POSTGRES_DB: bomberos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432" 
    networks:
      red_bomberos_estatica:
        ipv4_address: 172.10.10.40
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bomberos_redis
    ports:
      - "6379:6379"
    networks:
      red_bomberos_estatica:
        ipv4_address: 172.10.10.50

volumes:
  postgres_data:

# Rango de 254 direcciones disponibles
networks:
  red_bomberos_estatica:
    driver: bridge
    ipam:
      config:
        - subnet: 172.10.10.0/24