#Estandarizacion de direcciones
#NGINX:    172.10.10.10
#Backs:    172.10.10.20 - 21 - 22
#Front:    172.10.10.30 - 31 - 32
#Postgres: 172.10.10.40 - 41 - 42
#Redis:    172.10.10.50

services:
  api_gateway:
    image: nginx:alpine
    container_name: bomberos_api_gateway
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro 
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bomberos_backend
    restart: always
    command: sh -c "pip install -e /auth-common --quiet && python app.py"
    volumes:
      - ./planes/backend:/app
      - ./planes/auth-common:/auth-common
    env_file:
      - ../backend/.env
    environment:
      - PORT=5000
      - REDIS_HOST=172.10.10.50
      - AUTH_COMMON_REDIS_URL=redis://redis:6379/0
      - AUTH_COMMON_SESSION_TTL=900
    depends_on:
      - postgres-planes
      - redis

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: bomberos_frontend
    restart: always
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ../frontend:/app
      - /app/node_modules

  postgres:
    image: postgres:17
    container_name: bomberos_postgres
    restart: always
    environment:
      POSTGRES_DB: bomberos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bomberos_redis

volumes:
  postgres_data:
