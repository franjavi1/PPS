services:
  api_gateway:
    image: nginx:alpine
    container_name: bomberos_api_gateway
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro 
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bomberos_backend
    restart: always
    volumes:
      - ../backend:/app
    env_file:
      - ../backend/.env
    environment:
      - PORT=5000
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: bomberos_frontend
    restart: always
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ../frontend:/app
      - /app/node_modules

  postgres:
    image: postgres:16
    container_name: bomberos_postgres
    restart: always
    environment:
      POSTGRES_DB: bomberos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bomberos_redis

volumes:
  postgres_data:

networks:
 - 
